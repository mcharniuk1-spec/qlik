name: export-bi-milk-2024-2026

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "discover or export"
        required: true
        default: "export"
  schedule:
    - cron: "12 10 * * *"  # daily ~10:12 UTC (adjust as needed)

permissions:
  contents: write

concurrency:
  group: export-bi-milk-2024-2026
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node deps (Playwright)
        run: |
          npm init -y
          npm i -D playwright
          npx playwright install --with-deps chromium

      - name: Export from Qlik BI (discover/export)
        env:
          CONFIG: config/bi_milk.json
          OUT_DIR: out/bi
          DISCOVER: ${{ inputs.mode == 'discover' && '1' || '0' }}
        run: |
          node scripts/qlik_export_bi_milk.mjs

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl

      - name: Build final XLSX (data + logs)
        if: ${{ inputs.mode != 'discover' }}
        env:
          CONFIG: config/bi_milk.json
          OUT_DIR: out/bi
          DEST_XLSX: data/prozorro_bi_milk_2024_2026.xlsx
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          python src/build_bi_milk_xlsx.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prozorro-bi-milk-${{ github.run_id }}
          path: |
            out/bi/*
            data/prozorro_bi_milk_2024_2026.xlsx

      - name: Commit results to repo
        if: ${{ inputs.mode != 'discover' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/prozorro_bi_milk_2024_2026.xlsx || true
          git commit -m "Update Prozorro BI milk XLSX (2024-2026)" || echo "Nothing to commit"
          git push || true
