name: export-bi-milk-2024-2026

on:
  workflow_dispatch:
  schedule:
    # 12:00 Kyiv (зима = UTC+2) => 10:00 UTC
    - cron: "0 10 * * *"

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: bi-export
        run: npm install

      - name: Install Playwright (Chromium)
        working-directory: bi-export
        run: npx playwright install --with-deps chromium

      - name: Run export (milk 2024-2026)
        working-directory: bi-export
        env:
          BI_TABLE_VIZ_ID: ${{ secrets.BI_TABLE_VIZ_ID }}
        run: node src/cli.js export --config config/bi_milk.json

      - name: Upload artifact (xlsx + logs + raw)
        uses: actions/upload-artifact@v4
        with:
          name: prozorro-bi-milk-2024-2026
          if-no-files-found: error
          path: |
            bi-export/out/*.xlsx
            bi-export/out/*.json
            bi-export/out/*.jsonl
            bi-export/out/*.csv
