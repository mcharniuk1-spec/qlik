name: prozorro-milk-export

on:
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *" # daily 03:15 UTC

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch tenders (incremental)
        env:
          OP_API_BASE: https://public.api.openprocurement.org/api/2.5
          DATA_DIR: data
          # Optional: limit docs per run for testing (remove later)
          # MAX_DOCS: "1000"
        run: |
          python -m src.fetch_tenders

      - name: Normalize milk and export CSV/XLSX
        env:
          DATA_DIR: data
          OUT_DIR: out
          MILK_CPV: "15510000-6,15511000-3"
          MILK_KEYWORDS: "молоко,milk,пастер,ультрапастер,uht"
        run: |
          python -m src.normalize_milk

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/state.json out/*.csv out/*.xlsx data/tenders_raw.jsonl || true
          git commit -m "Update milk export" || echo "No changes to commit"
          git push || true
