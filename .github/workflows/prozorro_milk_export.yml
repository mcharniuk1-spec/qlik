name: export

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "incremental або backfill"
        required: true
        default: "incremental"
      max_pages:
        description: "Скільки сторінок /tenders обробити за запуск"
        required: true
        default: "25"
      max_runtime_seconds:
        description: "Ліміт часу (сек) на fetch-крок"
        required: true
        default: "2400"
  schedule:
    - cron: "17 3 * * *"   # щодня

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OP_API_BASE: "https://public.api.openprocurement.org/api/2.5"
      DATA_DIR: "data"
      OUT_DIR: "out"
      # дефолтні значення для schedule-run
      MODE: "incremental"
      MAX_PAGES: "25"
      MAX_RUNTIME_SECONDS: "2400"
      PAGE_SIZE: "100"
      CONCURRENCY: "12"
      # “молоко” — можна міняти в репо, без секретів
      MILK_CPV_PREFIXES: "1551"
      MILK_KEYWORDS: "молоко,milk,uht,ультрапастер,пастер"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve inputs (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "MODE=${{ inputs.mode }}" >> $GITHUB_ENV
          echo "MAX_PAGES=${{ inputs.max_pages }}" >> $GITHUB_ENV
          echo "MAX_RUNTIME_SECONDS=${{ inputs.max_runtime_seconds }}" >> $GITHUB_ENV

      - name: Fetch tenders (bounded incremental/backfill)
        run: |
          python -m src.fetch_tenders

      - name: Normalize milk and export CSV/XLSX
        run: |
          python -m src.normalize_milk

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A data out || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update milk exports (auto)"
          git push
