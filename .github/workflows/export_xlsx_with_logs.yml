name: export-xlsx-with-logs

on:
  workflow_dispatch:
    inputs:
      max_pages:
        description: "Pages of /tenders feed per run"
        required: true
        default: "25"
      max_runtime_seconds:
        description: "Hard cap for fetch step (seconds)"
        required: true
        default: "2400"
      reset_state:
        description: "true to reset state.json"
        required: true
        default: "false"
      reset_db:
        description: "true to reset SQLite DB"
        required: true
        default: "false"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      OP_API_BASE: "https://public.api.openprocurement.org/api/2.5"
      DATA_DIR: "data"
      OUT_DIR: "out"
      LOG_DIR: "out/logs"
      KEEP_LOG_FILES: "20"

      MAX_PAGES: "25"
      MAX_RUNTIME_SECONDS: "2400"
      PAGE_SIZE: "100"
      CONCURRENCY: "12"

      # Optional: start from a specific cursor (string). Usually leave empty.
      START_OFFSET: ""

      # Milk filter
      MILK_CPV_PREFIXES: "1551"
      MILK_KEYWORDS: "молоко,milk,uht,ультрапастер,пастер,вершки,cream"

      RESET_STATE: "false"
      RESET_DB: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -V
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve inputs (workflow_dispatch only)
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          echo "MAX_PAGES=${{ inputs.max_pages }}" >> $GITHUB_ENV
          echo "MAX_RUNTIME_SECONDS=${{ inputs.max_runtime_seconds }}" >> $GITHUB_ENV
          echo "RESET_STATE=${{ inputs.reset_state }}" >> $GITHUB_ENV
          echo "RESET_DB=${{ inputs.reset_db }}" >> $GITHUB_ENV

      - name: Fetch tenders (bounded)
        run: |
          python -m src.fetch_tenders

      - name: Export XLSX with logs inside
        run: |
          python -m src.normalize_milk

      - name: Upload artifacts (xlsx + logs)
        uses: actions/upload-artifact@v4
        with:
          name: prozorro-milk-xlsx-with-logs
          path: |
            out/milk_export.xlsx
            out/logs/*
            out/reports/*

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add -A out data || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update XLSX with logs (auto)"
          git push
