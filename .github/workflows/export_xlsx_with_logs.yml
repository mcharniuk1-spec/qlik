# .github/workflows/export_xlsx_with_logs.yml
name: export-xlsx-with-logs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "ISO date start (optional). Example: 2020-01-01"
        required: false
        default: ""
      end_date:
        description: "ISO date end (optional). Example: 2020-12-31"
        required: false
        default: ""
      max_seconds:
        description: "Hard budget for fetching stage (seconds)"
        required: false
        default: "3000"
  schedule:
    - cron: "20 3 * * *"

permissions:
  contents: write

concurrency:
  group: export-xlsx-with-logs
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest

    env:
      DATA_DIR: data
      DB_PATH: data/prozorro_milk.sqlite
      STATE_PATH: data/state.json
      XLSX_PATH: data/prozorro-milk.xlsx
      RUN_LOG_JSONL: data/run_logs.jsonl
      OP_API_BASE: https://public.api.openprocurement.org/api/2.5

      # Якщо у тебе fetch_tenders читає такі env-и — вони підхопляться.
      START_DATE: ${{ inputs.start_date }}
      END_DATE: ${{ inputs.end_date }}
      MAX_SECONDS: ${{ inputs.max_seconds }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Fetch tenders (bounded)
        run: |
          # твій існуючий модуль фетчу лишається як є
          python -m src.fetch_tenders

      - name: Normalize + write XLSX into data/
        run: |
          # головне: XLSX пишеться в data/ і потім потрапляє в git
          python -m src.normalize_milk --data-dir data

      - name: Upload artifact (XLSX)
        uses: actions/upload-artifact@v4
        with:
          name: prozorro-milk-xlsx-with-logs
          path: |
            data/prozorro-milk.xlsx
            data/run_logs.jsonl
            data/state.json
            data/prozorro_milk.sqlite

      - name: Commit results (DB/state/XLSX/logs)
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # додаємо тільки те, що треба зберігати в repo
          git add -A data/prozorro_milk.sqlite data/state.json data/prozorro-milk.xlsx data/run_logs.jsonl

          # якщо змін немає — не падаємо
          git diff --cached --quiet && echo "No changes to commit." && exit 0

          git commit -m "Update XLSX with logs (auto)"
          git push
